plugins {
    id 'fabric-loom' version '1.4.1' apply false
    id 'org.sinytra.wiki.toolkit' version '0.1.16'
}

// all projects including the root project
allprojects {
    apply plugin: 'java'

    base {
        archivesName = "$mod_id-${project.name}-$minecraft_version"
    }
    repositories {
        mavenCentral()
        maven {
            name = 'ParchmentMC'
            url  = 'https://maven.parchmentmc.org'
        }
    }
    java {
        withSourcesJar()
        toolchain.languageVersion = JavaLanguageVersion.of(17)
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// all projects but the root project
subprojects {
    apply plugin: 'maven-publish'

    sourceSets {
        main {
            resources {
                srcDir(file("src/main/generated"))
                exclude("**/.cache")
            }
        }
    }

    repositories {
        mavenCentral()
        
        // ModMaven
        // mirrors a lot of commonly used Mavens
        maven { url = "https://modmaven.dev" }
        // CurseMaven
        // Jade, Oracle Index
        maven { url = "https://beta.cursemaven.com" }
        
        // Architectury API, REI
        maven { url = "https://maven.architectury.dev/" }
        // Athena (CTM)
        maven { url = "https://maven.teamresourceful.com/repository/maven-public/" }
        // EMI
        maven { url = 'https://maven.terraformersmc.com/' }
        // Forgified Fabric API
        maven { url = "https://maven.su5ed.dev/releases" }
        // FTB Chunks
        maven { url = "https://maven.ftb.dev/releases" }
        // GeckoLib
        maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
        // owo-lib
        maven { url = 'https://maven.wispforest.io/releases/' }
    }

    dependencies {
        // Auto Services
        compileOnly "com.google.auto.service:auto-service:$autoServiceVersion"
        annotationProcessor "com.google.auto.service:auto-service:$autoServiceVersion"
    }

    ['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
        configurations."$variant".outgoing {
            capability("$group:${base.archivesName.get()}:$version")
            capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
            capability("$group:$mod_id:$version")
        }
        publishing.publications.configureEach {
            suppressPomMetadataWarningsFor(variant)
        }
    }

    tasks.withType(AbstractCopyTask).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    // configure Maven publishing
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
        repositories {
            maven {
                url System.getenv('local_maven_url')
            }
        }
    }
}

// only loader projects
subprojects {
    if (project.path == ":common") {
        return
    }

    configurations {
        commonJava {
            canBeResolved = true
        }
        commonResources {
            canBeResolved = true
        }
    }

    dependencies {
        compileOnly(project(':common')) {
            capabilities {
                requireCapability "$group:$mod_id"
            }
            transitive = false
        }
        commonJava project(path: ':common', configuration: 'commonJava')
        commonResources project(path: ':common', configuration: 'commonResources')
    }

    sourceSets {
        create("data") {
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
            compileClasspath += sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.runtimeClasspath
        }
    }

    tasks {
        processResources {
            dependsOn(configurations.commonResources)
            from(configurations.commonResources)
            
            // copy wiki folder to assets
            from("$rootDir/docs") {
                into "assets/oracle_index/books/oritech"
                exclude '.assets/item/**' // items are rendered in-game as actual item components, no need to include them here
            }
        
            inputs.property 'version', project.version
            filesMatching(["fabric.mod.json"]) {
                expand version: version
            }
        }

        named('compileJava', JavaCompile) {
            dependsOn(configurations.commonJava)
            source(configurations.commonJava)
        }

        named('sourcesJar', Jar) {
            dependsOn(configurations.commonJava)
            from(configurations.commonJava)
            dependsOn(configurations.commonResources)
            from(configurations.commonResources)
        }
    }
}

